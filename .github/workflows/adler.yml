name: Adler Autopilot

on:
  schedule:
    - cron: "7 * * * *"        # stündlich
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur testen (nichts posten)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency: adler-autopilot

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Autopilot
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_SMTP_HOST: ${{ secrets.MAIL_SMTP_HOST }}
          MAIL_IMAP_HOST: ${{ secrets.MAIL_IMAP_HOST }}
          MAIL_APPROVERS: ${{ secrets.MAIL_APPROVERS }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python bot.py --dry-run
          else
            python bot.py
          fi
