name: Adler Autopilot

on:
  schedule:
    - cron: "7 * * * *"        # stündlich
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur testen (nichts posten)"
        type: boolean
        default: true
      plan_season:
        description: "Saison planen: alle offenen Ankündigungen in Buffer einplanen"
        type: boolean
        default: false
      export_crests:
        description: "Gegner-Wappen für den Ergebnis-Generator nach docs/ exportieren"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: adler-autopilot

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Autopilot
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HANDBALL_ICS: https://www.handball.net/kalender/team/81928.ics
        run: |
          args=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.dry_run }}" = "true" ]; then args="$args --dry-run"; fi
            if [ "${{ inputs.plan_season }}" = "true" ]; then args="$args --plan-season"; fi
            if [ "${{ inputs.export_crests }}" = "true" ]; then args="--export-crests"; fi
          fi
          python bot.py $args
      - name: Vorschau-Grafiken hochladen
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: vorschau
          path: out/
          if-no-files-found: ignore
      - name: Vorschau auf Entwicklungs-Branch ablegen
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && github.ref_name != 'main' }}
        run: |
          mkdir -p vorschau
          cp out/*.png vorschau/ || true
          git config user.name "adler-autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git add vorschau
          git commit -m "Vorschau-Grafiken" || exit 0
          git pull --rebase --autostash
          git push
      - name: Wappen und Teamliste ablegen
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.export_crests && github.ref_name != 'main' }}
        run: |
          git config user.name "adler-autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git add docs
          git commit -m "Gegner-Wappen und Teamliste" || exit 0
          git pull --rebase --autostash
          git push

