name: Adler Autopilot

on:
  schedule:
    - cron: "7 * * * *"        # stündlich
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur testen (nichts posten)"
        type: boolean
        default: true
      plan_season:
        description: "Saison planen: alle offenen Ankündigungen in Buffer einplanen"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: adler-autopilot

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Autopilot
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HANDBALL_ICS: https://www.handball.net/kalender/team/81928.ics
        run: |
          args=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.dry_run }}" = "true" ]; then args="$args --dry-run"; fi
            if [ "${{ inputs.plan_season }}" = "true" ]; then args="$args --plan-season"; fi
          fi
          python bot.py $args
